<h3>操作・期限履歴</h3>

<div class="history-container">
<div *ngFor="let history of histories" class="history"  [ngClass]="history.action">

    <div class="detail">
    ●{{ history.detail }}
    </div>
    <div class="time">
    {{ history.createdAt | date:'MM/dd HH:mm' }} 
    </div>
    <div class="title">
    タスクタイトル：{{ history.taskTitle }}
    </div>
</div>
</div>

<div *ngIf="histories.length > 0" class="clear-button">
    <button (click)="clearHistory()" type="button">履歴をクリア</button>
</div>
