 <h2>タスク入力</h2>
 
 <div class="task-form">
    
    <div class="form-group">
      <label>タスク名(50字まで)※必須</label>
      <textarea 
      [(ngModel)]="title" 
      name="title" 
      placeholder="タスク名" 
      (input)="onInputLimit($event, 50, 'title')"
      maxlength="50" 
      required></textarea>

      <div class="char-count">
        {{ title?.length || 0 }} / 50
      </div>
    </div>
  
    <div class="form-group">
      <label>メモ(200字まで)</label>
      <textarea
      [(ngModel)]="memo" 
      name="memo" 
      placeholder="メモ" 
      (input)="onInputLimit($event, 200, 'memo')"
      maxlength="200"></textarea>

      <div class="char-count">
        {{ memo?.length || 0 }} / 200
      </div>
    </div>
  
    <div class="form-group">
      <label>期限 ※必須</label>
      <input
        type="datetime-local"
        [(ngModel)]="deadline"
        name="deadline">
    </div>
  
    <div class="form-group">
      <label>通知設定</label>
      <select [(ngModel)]="notifyBefore" name="notifyBefore">
        <option [ngValue]="null">なし</option>
        <option [ngValue]="10">10分後</option>
        <option [ngValue]="30">30分後</option>
        <option [ngValue]="60">1時間後</option>
        <option [ngValue]="180">3時間後</option>
        <option [ngValue]="360">6時間後</option>
        <option [ngValue]="720">12時間後</option>
        <option [ngValue]="1440">1日後</option>
      </select>
    </div>

    <div class="form-group">
      <label>優先順位</label>
      <select [(ngModel)]="priority" name="priority" >
        <option [ngValue]="3">高</option>
        <option [ngValue]="2">中</option>
        <option [ngValue]="1">低</option>
      </select>
    </div>
  
    <button (click)="addTasks()" type="button">入力完了</button>
  </div>
